  <rect x="130" y="170" width="10" height="10" fill="#333"/>
  <rect x="170" y="90" width="10" height="10" fill="#333"/>
  <rect x="170" y="110" width="10" height="10" fill="#333"/>
  <rect x="170" y="130" width="10" height="10" fill="#333"/>
  
  <text x="125" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">UPI QR Code</text>
